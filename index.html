<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Was ist hier normal? – Interkulturelle Situationen</title>
<style>
  :root{
    --pink:#ffebea;
    --purple:#be91c9;
    --purple-d:#8e5aa0;
    --peach:#fde5c1;
    --white:#ffffff;
    --text:#202424;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI', Arial, sans-serif;
    background:var(--pink);
    color:var(--text);
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:28px 16px 64px;
  }
  #logo{ max-height:80px; display:block; margin:0 auto 12px; }
  h1{ font-size:1.7rem; margin:0 0 4px; text-align:center; }
  p.subtitle{ margin:0 0 22px; font-size:1rem; opacity:0.85; text-align:center; max-width:540px; line-height:1.5; }
  .wrap{ width:100%; max-width:580px; }
  button{ font-family:inherit; }
  :focus-visible{ outline:3px solid var(--purple-d); outline-offset:2px; }

  /* Filter + Werkzeuge */
  .toolbar{ display:flex; flex-direction:column; gap:10px; margin-bottom:14px; }
  .tools{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
  .tool-btn{
    background:var(--peach);
    border:none;
    border-radius:999px;
    padding:8px 14px;
    font-weight:700;
    font-size:0.85rem;
    cursor:pointer;
    color:var(--text);
  }

  /* Navigation */
  .nav-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-bottom:6px; }
  .nav-btn{
    background:var(--purple-d);
    color:var(--white);
    border:none;
    border-radius:999px;
    width:42px; height:42px;
    font-size:1.2rem;
    cursor:pointer;
    flex:none;
  }
  .dots{ display:flex; gap:6px; flex-wrap:wrap; justify-content:center; }
  .dot{ width:14px; height:14px; border-radius:50%; background:var(--peach); border:none; padding:0; cursor:pointer; }
  .dot[aria-current="true"]{ background:var(--purple-d); }
  .counter{ text-align:center; font-size:0.8rem; opacity:0.7; margin-bottom:12px; }

  /* Flipkarte */
  .scene{ perspective:1600px; margin-bottom:20px; }
  .card{
    display:grid;
    position:relative;
    transform-style:preserve-3d;
    transition:transform 0.6s cubic-bezier(.4,.2,.2,1);
    cursor:pointer;
  }
  .card.flipped{ transform:rotateY(180deg); }
  .face{
    grid-area:1 / 1;
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
    background:var(--white);
    border-radius:22px;
    box-shadow:0 10px 26px rgba(32,36,36,0.15);
    padding:22px 24px 24px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }
  .face.back{ transform:rotateY(180deg); }

  .face-head{ display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
  .country{ display:inline-flex; align-items:center; gap:8px; font-weight:700; font-size:0.9rem; }
  .flag{ width:30px; height:20px; border-radius:3px; box-shadow:0 0 0 1px rgba(32,36,36,0.2); flex:none; display:block; }
  .cat-chip{
    background:var(--pink);
    color:var(--purple-d);
    border-radius:999px;
    padding:4px 11px;
    font-size:0.72rem;
    font-weight:700;
  }
  .title-row{ display:flex; align-items:flex-start; gap:12px; }
  .badge{
    flex:none;
    width:34px; height:34px;
    border-radius:50%;
    background:var(--purple-d);
    color:var(--white);
    font-weight:800;
    display:flex; align-items:center; justify-content:center;
    margin-top:2px;
  }
  h2{ margin:0; font-size:1.3rem; line-height:1.3; }
  h2.small{ font-size:1.05rem; }
  .sit{ margin:0; font-size:1.05rem; line-height:1.65; }

  .disc{ background:var(--pink); border-radius:14px; padding:14px 16px; }
  .disc .label, h3{ font-size:0.78rem; text-transform:uppercase; letter-spacing:0.04em; font-weight:800; color:var(--purple-d); margin:0 0 6px; }
  .disc ul{ margin:0; padding-left:20px; line-height:1.6; font-size:0.97rem; }

  .bonus{ background:var(--peach); border-radius:14px; padding:14px 16px; }
  .bonus p{ margin:0; line-height:1.55; font-size:1.05rem; font-weight:600; }
  ul.redemittel{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; }
  ul.redemittel li{ background:var(--pink); border-radius:12px; padding:9px 14px; font-style:italic; font-size:0.93rem; line-height:1.5; }

  .flip-btn{
    margin-top:auto;
    align-self:center;
    background:var(--purple-d);
    color:var(--white);
    border:none;
    border-radius:999px;
    padding:11px 22px;
    font-size:0.92rem;
    font-weight:700;
    cursor:pointer;
  }

  .note{ background:var(--peach); border-radius:20px; padding:20px 24px; }
  .note h3{ font-size:0.9rem; text-transform:none; letter-spacing:0; margin:0 0 6px; }
  .note p{ margin:0 0 6px; line-height:1.6; }
  .note p:last-child{ margin-bottom:0; }

  @media (max-width:420px){
    .face{ padding:18px 16px 20px; }
    h2{ font-size:1.15rem; }
    .sit{ font-size:1rem; }
  }
  @media (prefers-reduced-motion:reduce){
    .card{ transition:none; }
  }
</style>
</head>

/* ---------- Flaggen (SVG, damit sie auch unter Windows erscheinen) ---------- */
function stripesH(cols){ const h = 40 / cols.length; return cols.map((c,i)=>`<rect x="0" y="${(i*h).toFixed(2)}" width="60" height="${(h+0.2).toFixed(2)}" fill="${c}"/>`).join(''); }
function stripesV(cols){ const w = 60 / cols.length; return cols.map((c,i)=>`<rect x="${(i*w).toFixed(2)}" y="0" width="${(w+0.2).toFixed(2)}" height="40" fill="${c}"/>`).join(''); }
function usFlag(){
  let s = '<rect width="60" height="40" fill="#fff"/>';
  const h = 40/13;
  for(let i=0;i<13;i+=2){ s += `<rect x="0" y="${(i*h).toFixed(2)}" width="60" height="${(h+0.1).toFixed(2)}" fill="#B22234"/>`; }
  s += `<rect x="0" y="0" width="26" height="${(h*7).toFixed(2)}" fill="#3C3B6E"/>`;
  for(let r=0;r<4;r++){ for(let c=0;c<5;c++){ s += `<circle cx="${(3+c*5).toFixed(1)}" cy="${(3.2+r*4.6).toFixed(1)}" r="1" fill="#fff"/>`; } }
  return s;
}
const FLAGS = {
  DE: stripesH(['#000000','#DD0000','#FFCE00']),
  FR: stripesV(['#0055A4','#FFFFFF','#EF4135']),
  NL: stripesH(['#AE1C28','#FFFFFF','#21468B']),
  ES: '<rect width="60" height="40" fill="#AA151B"/><rect y="10" width="60" height="20" fill="#F1BF00"/>',
  GB: '<rect width="60" height="40" fill="#012169"/><path d="M0,0 L60,40 M60,0 L0,40" stroke="#fff" stroke-width="8"/><path d="M0,0 L60,40 M60,0 L0,40" stroke="#C8102E" stroke-width="3"/><path d="M30,0 V40 M0,20 H60" stroke="#fff" stroke-width="12"/><path d="M30,0 V40 M0,20 H60" stroke="#C8102E" stroke-width="7"/>',
  US: usFlag(),
  IN: stripesH(['#FF9933','#FFFFFF','#138808']) + '<circle cx="30" cy="20" r="5" fill="none" stroke="#000080" stroke-width="1"/><circle cx="30" cy="20" r="1" fill="#000080"/>',
  JP: '<rect width="60" height="40" fill="#fff"/><circle cx="30" cy="20" r="12" fill="#BC002D"/>',
  FI: '<rect width="60" height="40" fill="#fff"/><rect x="16" width="10" height="40" fill="#003580"/><rect y="15" width="60" height="10" fill="#003580"/>',
  KR: '<rect width="60" height="40" fill="#fff"/><circle cx="30" cy="20" r="10" fill="#0047A0"/><path d="M20,20 A10,10 0 0 1 40,20 A5,5 0 0 1 30,20 A5,5 0 0 0 20,20 Z" fill="#CD2E3A"/>' +
      [[8,8],[52,8],[8,32],[52,32]].map(p=>[0,3,6].map(o=>`<rect x="${p[0]-4}" y="${p[1]-4+o}" width="8" height="1.6" fill="#000"/>`).join('')).join('')
};
function flag(code){
  return `<svg class="flag" viewBox="0 0 60 40" preserveAspectRatio="none" aria-hidden="true" focusable="false">${FLAGS[code] || '<rect width="60" height="40" fill="#ddd"/>'}</svg>`;
}

/* ---------- Hilfsfunktionen ---------- */
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmt(s){ return esc(s); }
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

const byId = {}; CARDS.forEach(c => byId[c.id] = c);
const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

const state = { order: CARDS.map(c=>c.id), idx:0, flipped:false, shuffled:false };
const deck = () => state.order.map(id=>byId[id]);

const card = document.getElementById('card');
const front = document.getElementById('front');
const back = document.getElementById('back');
const dotsEl = document.getElementById('dots');
const counter = document.getElementById('counter');
const shuffleBtn = document.getElementById('shuffle-btn');
let swapTimer = null;

function setFlipped(f, instant){
  state.flipped = f;
  const hadFocus = card.contains(document.activeElement);
  if(instant){ card.style.transition = 'none'; }
  card.classList.toggle('flipped', f);
  if(instant){ void card.offsetWidth; card.style.transition = ''; }
  front.inert = f; back.inert = !f;
  front.setAttribute('aria-hidden', f ? 'true' : 'false');
  back.setAttribute('aria-hidden', f ? 'false' : 'true');
  if(hadFocus){ const b = (f ? back : front).querySelector('.flip-btn'); if(b) b.focus({preventScroll:true}); }
}

function renderCard(){
  const d = deck();
  if(state.idx >= d.length) state.idx = 0;
  const c = d[state.idx];
  const head = `<div class="face-head"><span class="country">${flag(c.flag)}<span>${esc(c.country)}</span></span>`;
  front.innerHTML = head + `</div>
    <div class="title-row"><span class="badge" aria-hidden="true">${c.id}</span><h2>${c.emoji} ${esc(c.title)}</h2></div>
    <p class="sit">${fmt(c.sit)}</p>
    <div class="disc"><div class="label">Diskutieren Sie:</div><ul>${c.disc.map(q=>`<li>${fmt(q)}</li>`).join('')}</ul></div>
    <button class="flip-btn" type="button">🔄 Karte umdrehen</button>`;
  back.innerHTML = head + `<span class="cat-chip">Rückseite</span></div>
    <div class="title-row"><span class="badge" aria-hidden="true">${c.id}</span><h2 class="small">${c.emoji} ${esc(c.title)}</h2></div>
    <div class="bonus"><h3>Frage</h3><p class="frage">${fmt(c.frage)}</p></div>
    <div><h3>Redemittel</h3><ul class="redemittel">${c.redemittel.map(r=>`<li>${esc(r)}</li>`).join('')}</ul></div>
    <button class="flip-btn" type="button">↩ Zurück zur Situation</button>`;
  setFlipped(false, true);
}

function renderMeta(){
  const d = deck();
  counter.textContent = 'Karte ' + (state.idx+1) + ' von ' + d.length;
  dotsEl.innerHTML = '';
  d.forEach((c,i)=>{
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'dot';
    b.setAttribute('aria-label', 'Karte ' + (i+1) + ': ' + c.title);
    if(i === state.idx) b.setAttribute('aria-current','true');
    b.addEventListener('click', () => go(i));
    dotsEl.appendChild(b);
  });
  shuffleBtn.textContent = state.shuffled ? '↩ Ursprüngliche Reihenfolge' : '🔀 Mischen';
}

function go(i){
  const n = deck().length;
  state.idx = ((i % n) + n) % n;
  renderMeta();
  clearTimeout(swapTimer);
  if(state.flipped){
    setFlipped(false);
    swapTimer = setTimeout(renderCard, reduceMotion ? 0 : 320);
  } else {
    renderCard();
  }
}

/* ---------- Ereignisse ---------- */
card.addEventListener('click', e => { if(e.target.closest('a')) return; setFlipped(!state.flipped); });
document.getElementById('prev-btn').addEventListener('click', () => go(state.idx - 1));
document.getElementById('next-btn').addEventListener('click', () => go(state.idx + 1));
shuffleBtn.addEventListener('click', () => {
  state.shuffled = !state.shuffled;
  state.order = state.shuffled ? shuffle(CARDS.map(c=>c.id)) : CARDS.map(c=>c.id);
  state.idx = 0; clearTimeout(swapTimer); renderMeta(); renderCard();
});
document.getElementById('random-btn').addEventListener('click', () => {
  const n = deck().length; if(n < 2) return;
  let j; do { j = Math.floor(Math.random()*n); } while(j === state.idx);
  go(j);
});
document.addEventListener('keydown', e => {
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  if(e.key === 'ArrowRight'){ go(state.idx + 1); }
  else if(e.key === 'ArrowLeft'){ go(state.idx - 1); }
  else if((e.key === ' ' || e.key === 'Enter') && document.activeElement === document.body){ e.preventDefault(); setFlipped(!state.flipped); }
});

renderMeta();
renderCard();
})();
</script>
